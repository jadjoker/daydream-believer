services:
  - type: web
    name: daydream-believer-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # paste your key in the Render dashboard
      - key: CORS_ORIGINS
        sync: false          # paste your Vercel URL here after frontend is deployed
      - key: DB_PATH
        value: simulator.db  # ephemeral on free tier — resets on restart
